name: Slack delivery and build notifications
on:
  workflow_run:
    workflows: [Build, Android Build, Regression tests]
    types: [completed]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    # Fork pull requests cannot cause notifications using repository secrets.
    if: github.event_name == 'release' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Use trusted default-branch code, never the workflow_run head ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Notify Slack
        continue-on-error: true
        run: node scripts/slack/notify-ci.cjs
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          SLACK_EVENT_TITLE: ${{ github.event.workflow_run.name || github.event.release.name || 'GitHub release published' }}
          SLACK_EVENT_STATUS: ${{ github.event.workflow_run.conclusion || 'GitHub release published (store availability tracked separately)' }}
          SLACK_EVENT_URL: ${{ github.event.workflow_run.html_url || github.event.release.html_url }}
