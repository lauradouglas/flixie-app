include: package:flutter_lints/flutter.yaml

# This byte-verified historical benchmark must retain its original source.
analyzer:
  exclude:
    - patrol_test/support/group_insights_memory_before.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - sized_box_for_whitespace
    - use_key_in_widget_constructors
